    <body>
        <div class="card" style="width: 100%">

                    <div class="row no-gutters">
                        <div class="col-10 pb-2">
                            <select
                            class="form-select"
                            aria-label="Default select example"

                        </div>

            <div id="config"></div>
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              
                  new TomSelect("#select-node",{
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      }
                  });
              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#16e5e5", "id": 4586, "label": "4586", "physics": false, "shape": "star", "size": 180, "title": "_\u2502O\u2502_\n_\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 180, "x": 0, "y": 0}, {"color": "#e51616", "id": 11147, "label": "11147", "shape": "circle", "size": 120, "title": "X\u2502O\u2502_\n_\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 120}, {"color": "#e51616", "id": 5315, "label": "5315", "shape": "circle", "size": 120, "title": "_\u2502O\u2502X\n_\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 120}, {"color": "#e51616", "id": 4829, "label": "4829", "shape": "circle", "size": 120, "title": "_\u2502O\u2502_\nX\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 120}, {"color": "#16e5e5", "id": 12605, "label": "12605", "shape": "box", "size": 60, "title": "X\u2502O\u2502O\n_\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}, {"color": "#16e5e5", "id": 11633, "label": "11633", "shape": "circle", "size": 60, "title": "X\u2502O\u2502_\nO\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}, {"color": "#16e5e5", "id": 18437, "label": "18437", "shape": "box", "size": 60, "title": "O\u2502O\u2502X\n_\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}, {"color": "#16e5e5", "id": 5801, "label": "5801", "shape": "circle", "size": 60, "title": "_\u2502O\u2502X\nO\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}, {"color": "#16e5e5", "id": 17951, "label": "17951", "shape": "box", "size": 60, "title": "O\u2502O\u2502_\nX\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}, {"color": "#16e5e5", "id": 6287, "label": "6287", "shape": "box", "size": 60, "title": "_\u2502O\u2502O\nX\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}, {"color": "#e51616", "id": 12362, "label": "12362", "shape": "ellipse", "size": 60, "title": "X\u2502O\u2502X\nO\u2502O\u2502X\nO\u2502X\u2502O\n", "value": 60}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": 4586, "to": 11147}, {"arrows": "to", "from": 4586, "to": 5315}, {"arrows": "to", "from": 4586, "to": 4829}, {"arrows": "to", "from": 11147, "to": 12605}, {"arrows": "to", "from": 11147, "to": 11633}, {"arrows": "to", "from": 11633, "to": 12362}, {"arrows": "to", "from": 5315, "to": 18437}, {"arrows": "to", "from": 5315, "to": 5801}, {"arrows": "to", "from": 5801, "to": 12362}, {"arrows": "to", "from": 4829, "to": 17951}, {"arrows": "to", "from": 4829, "to": 6287}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": true
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  
                  // if this network requires displaying the configure window,
                  // put it in its div
                  options.configure["container"] = document.getElementById("config");
                  

                  network = new vis.Network(container, data, options);

                  

                  
                    network.on("selectNode", neighbourhoodHighlight);
                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
